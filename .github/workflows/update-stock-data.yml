# 5분마다 자동 갱신.
#
# GitHub 은 "*/5" 스케줄을 보장하지 않는다. 실제로 2026-09-13 부터 하루 288회가
# 아니라 5~8회(3~6시간 간격)로 드랍됐다. 그래서 트리거 자체에 기대지 않고,
# 한 번 실행되면 그 안에서 5분 주기로 5시간 동안 반복 갱신한다.
# concurrency.cancel-in-progress 덕분에 다음 트리거가 오면 알아서 교체된다.
name: Update Stock Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stock-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pandas requests yfinance pywebpush

      - name: 5분 주기로 반복 갱신
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 5 * 60 * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            CYCLE_START=$(date +%s)

            # 긴 루프 도중 일일 펀더멘털 워크플로가 푸시했을 수 있다.
            # 매 주기 원격 최신본에서 다시 시작해야 push 가 거부되지 않는다.
            # (CI 전용 체크아웃이라 버릴 로컬 작업이 없다)
            git fetch origin main --quiet && git reset --hard origin/main --quiet

            if python3 update_stock_data.py; then
              if git diff --quiet -- 주식서포터.html; then
                echo "변경 없음, 커밋 생략"
              else
                git add 주식서포터.html
                git commit -m "chore: 주가/RSI/등락률 자동 갱신 [skip ci]"
                # 실패해도 루프를 죽이지 않는다. 다음 주기에 최신본에서 다시 만든다.
                git push || echo "푸시 실패, 다음 주기에 재시도"
              fi
              # 알림은 부가 기능이라 실패해도 시세 갱신을 막지 않게 한다.
              python3 send_price_alerts.py || echo "알림 발송 실패(무시)"
            else
              echo "갱신 스크립트 실패, 다음 주기에 재시도"
            fi

            ELAPSED=$(( $(date +%s) - CYCLE_START ))
            if [ "$ELAPSED" -lt 300 ]; then sleep $(( 300 - ELAPSED )); fi
          done
